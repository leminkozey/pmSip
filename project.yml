name: pmSip
options:
  bundleIdPrefix: com.leminkozey
  deploymentTarget:
    macOS: "13.0"
targets:
  pmSip:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: pmSip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leminkozey.pmsip
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        INFOPLIST_KEY_LSUIElement: "YES"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        GENERATE_INFOPLIST_FILE: "YES"
        ENABLE_HARDENED_RUNTIME: "YES"
schemes:
  pmSip:
    build:
      targets:
        pmSip: all
    run:
      config: Debug
    archive:
      config: Release
